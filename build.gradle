plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against, on EVERY branch.
// All three lines share a mod version, so two files both called
// legendquest-2.2.1.jar are indistinguishable in a mods folder or on a
// releases page. Tagging only the 26.x jars would be enough to tell them
// apart, but it leaves the 1.21.11 one as the odd unlabelled file you have to
// know about -- and "the one with no suffix" reads as an oversight rather than
// as a meaning. The mod's own version in neoforge.mods.toml stays plain.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")            // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add additional repositories here if required by dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Parchment gives human-readable parameter names/javadocs. Optional.
    // Enabled only when both properties are set in gradle.properties (some MC
    // versions may not have Parchment mappings published yet).
    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    // Access Transformers are auto-detected from META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A second pair of hands: 'runClientBuddy' opens a dev client named
        // TestBuddy for multiplayer testing (parties!) against the dev
        // server — no second account needed (dev server is online-mode=false).
        clientBuddy {
            client()
            // 25566, not the default 25565. Five of Sable's mods have a dev server and
            // four of them were on 25565 and RCON 25575, so whichever started second
            // silently lost. Each project now owns a pair -- see CLAUDE.md.
            programArguments.addAll '--username', 'TestBuddy', '--quickPlayMultiplayer', '127.0.0.1:25566'
            // Own game dir: sharing run/ with a live dev server means
            // both fight over logs/latest.log on drvfs.
            gameDirectory = file('runBuddy')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' declares runtime-only test dependencies that are NOT published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // SnakeYAML powers the YAML front door for races/classes/skills; it is
    // embedded in the mod jar (jar-in-jar) since Minecraft does not ship it.
    implementation 'org.yaml:snakeyaml:2.2'
    jarJar('org.yaml:snakeyaml') {
        version {
            strictly '[2.2,3.0)'
            prefer '2.2'
        }
    }

    // Standards supplies the chat name-decorator API. compileOnly and NOT
    // jarJar'd: it is a SOFT dependency, so LegendQuest builds against the API
    // and must run perfectly well without the mod present. ChatSupport is the
    // only class that imports it, and is only loaded when standards is.
    //
    // A local file rather than a maven coordinate because Standards is not
    // published anywhere yet. fileTree so an absent jar just leaves the API off
    // the classpath instead of failing project configuration outright.
    compileOnly fileTree(dir: '../SableCraft-Standards/build/libs', include: ['standards-*.jar'])
}

// Expand mod metadata properties into the generated neoforge.mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
