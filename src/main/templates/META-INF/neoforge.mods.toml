# LegendQuest ReForged — neoforge.mods.toml (values are expanded from gradle.properties at build time).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/LegendQuest-ReForged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
# The site, not the repo: this is the link in the mods list, and the people
# who click it want to know what the mod does, not how it is built. The repo
# is still one click away from there, and issueTrackerURL above goes straight
# to GitHub for the people who want that.
displayURL="https://sablecraft.co.uk/legendquest-reforged/"
# The mod list changed shape in 26.2, so artwork is declared three ways and
# older loaders simply ignore the keys they do not know:
#   iconFile   - the small SQUARE beside the name in the list (26.2+). Without
#                one, our row is the only one in the list with no icon.
#   bannerFile - the wide image in the info panel (26.2+), drawn at its own
#                aspect ratio, which is what the wordmark was always for.
#   logoFile   - what 1.21.x and 26.1 show in the info panel, and what 26.2
#                falls back to when bannerFile is absent. Kept so older
#                versions still show artwork.
iconFile="legendquest-icon.png"
bannerFile="legendquest.png"
logoFile="legendquest.png"
# The white wordmark, because the mods list paints on a dark panel; the black
# variant for light backgrounds lives in docs/branding. Smoothed rather than
# nearest-neighbour: this is antialiased artwork at 1100px being scaled down to
# fit a small panel, and point sampling shreds the thin serifs.
logoBlur=true
# Smoothed for the same reason logoFile is: the icon is the 1100px wordmark
# padded to a square, so it is scaled a long way down to fill a small slot and
# point sampling would shred the serifs.
iconBlur=true

# The mod is server-authoritative: vanilla clients can join and play. The
# optional client entrypoint adds the mana/skill HUD for modded clients.

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
