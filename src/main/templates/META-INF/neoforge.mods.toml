# LegendQuest ReForged — neoforge.mods.toml (values are expanded from gradle.properties at build time).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/LegendQuest-ReForged/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
# The site, not the repo: this is the link in the mods list, and the people
# who click it want to know what the mod does, not how it is built. The repo
# is still one click away from there, and issueTrackerURL above goes straight
# to GitHub for the people who want that.
displayURL="https://sablecraft.co.uk/legendquest-reforged/"
# The mod list changed shape in 26.2, so artwork is declared three ways and
# older loaders simply ignore the keys they do not know:
#   iconFile   - the small SQUARE beside the name in the list (26.2+). Without
#                one, our row is the only one in the list with no icon.
#   bannerFile - the wide image in the info panel (26.2+), drawn at its own
#                aspect ratio, which is what the wordmark was always for.
#   logoFile   - what 1.21.x and 26.1 show in the info panel, and what 26.2
#                falls back to when bannerFile is absent. Kept so older
#                versions still show artwork.
iconFile="legendquest-icon.png"
bannerFile="legendquest.png"
logoFile="legendquest.png"
# The white wordmark, because the mods list paints on a dark panel; the black
# variant for light backgrounds lives in docs/branding. Smoothed rather than
# nearest-neighbour: this is antialiased artwork at 1100px being scaled down to
# fit a small panel, and point sampling shreds the thin serifs.
logoBlur=true
# Smoothed for the same reason logoFile is: a 418px badge scaled down to a small
# slot, where point sampling would shred the sword edges and the fine gold work.
iconBlur=true

# The mod is server-authoritative: vanilla clients can join and play. The
# optional client entrypoint adds the mana/skill HUD for modded clients.

# The NeoForge SERIES this was built for, not the exact build. Pinning the
# lower bound to the build on the developer's machine turns every patch release
# NeoForge makes into a support question -- 21.11.41 would be refused by a jar
# that works perfectly well on it. The upper bound matters just as much and was
# missing: an open-ended range claimed this jar worked on NeoForge 26.x and
# beyond, which is exactly the false promise the separate version branches
# exist to avoid. A NeoForge series tracks one Minecraft version, so the series
# is the honest unit.
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

# Standards is REQUIRED, and that is a change from 2.4.1 and earlier where it
# was optional. LegendQuest's character and skills panes are built on its
# inventory-panel seam: the host places them, frames them in our colours, and
# arbitrates with other mods' panes so two of them cannot overlap. It also
# carries the access transformer that replaced our reflective reads of vanilla's
# inventory-screen internals -- a rename there used to take the inventory screen
# away from every player, and now breaks a build instead.
[[dependencies.${mod_id}]]
    modId="standards"
    type="required"
    versionRange="${standards_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
