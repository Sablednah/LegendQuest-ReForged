# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.42
# Any build in the 21.11 series, which is the series that targets MC 1.21.11.
neo_version_range=[21.11,21.12)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=legendquest
mod_name=LegendQuest ReForged
mod_license=MIT
mod_version=2.5.1

# Standards is a REQUIRED dependency: LegendQuest's character panel is built on
# its inventory-panel seam.
#
# 1.7.0, NOT 1.6.0. PanelTheme, preferredHeight, renderOverlay and the
# unconditional onClose all landed in Standards WITHOUT the version moving, so a
# published 1.6.0 satisfies [1.6.0,) and then fails at class-load on PanelTheme.
# 1.8.0 because mouseReleased changed from void to boolean after 1.7.0 was
# pinned here. Compiled against the boolean and run against the void one,
# our override simply would not override -- the interface default would run,
# releases would not be consumed, and items would drop on the floor again
# with no error anywhere. The range is what makes that a refusal to load
# instead of a silent regression.
standards_version_range=[1.8.0,)

# Simple Voice Chat, for party voice channels. OPTIONAL: without it LegendQuest
# loses the voice channel and nothing else.
#
# 2.6.20 is the API version the 2.6.x mod jars themselves bundle -- the shipped
# mod declares an embedded `voicechat_api` mod at exactly this version -- so
# compiling against it is compiling against what will actually be on the server.
# The range below is the MOD's version, not the API's, and stops at the 2.6
# series because that is the series this was built and run against; a plugin API
# that grows a method is harmless, but one that moves it is a NoSuchMethodError
# long after start-up in a mod that looks innocent.
voicechat_api_version=2.6.20
# NO RANGE, and that is the measured answer rather than laziness.
#
# [2.6,3.0) looked obviously right and is unsatisfiable: Simple Voice Chat's mod
# version on 1.21.11 is "1.21.11-2.6.23" -- the Minecraft version is a PREFIX --
# so the range matched nothing, and because a declared range is checked whenever
# the mod IS present, FML refused to load LegendQuest at all. An optional
# dependency's range turned "voice chat installed" into "LegendQuest does not
# load". Seen on the Vivo rig, 2026-09-17, not reasoned about.
#
# And no single range could be right anyway: the same mod is "2.6.22+26.2" on
# the 26.x branches -- version first, Minecraft version as build metadata -- so
# the two lines do not even share a scheme. The API we compile against is the
# published voicechat-api artifact, which is versioned sanely and pinned above.
voicechat_version_range=[0,)
mod_group_id=com.sablednah.legendquest
mod_authors=Sablednah
mod_description=Races, classes, skills, karma and character progression. A modern NeoForge rewrite of the classic LegendQuest Bukkit RPG plugin.
